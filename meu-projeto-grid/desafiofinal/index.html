    <!DOCTYPE html>
    <html lang="pt-BR">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Loja de Camisetas</title>
        <link rel="stylesheet" href="estilo.css">
    </head>
    
    <body>
        <header>
            <span class="logo">Loja de Camisetas</span>
            <nav class="links">
                <a href="#">Início</a>
                <a href="#">Produtos</a>
                <a href="#">Contato</a>
            </nav>
        </header>
    
        <main>
            <div class="cartao">
                <div class="cartao-topo">
                    <h2>Camiseta Básica</h2>
                    <span class="preco">R$ 49</span>
                </div>
                <p>Algodão, várias cores.</p>
                <button>Comprar</button>
            </div>
            <div class="cartao">
                <div class="cartao-topo">
                    <h2>Camiseta Estampada</h2>
                    <span class="preco">R$ 79</span>
                </div>
                <p>estanpas exclusivas.</p>
                <button>Comprar</button>
            </div>
            <div class="cartao">
                <div class="cartao-topo">
                    <h2>Camiseta Oversized</h2>
                    <span class="preco">R$ 89</span>
                </div>
                <p>caimento largo.</p>
                <button>Comprar</button>
            </div>
            <div class="cartao">
                <div class="cartao-topo">
                    <h2>Camiseta dry</h2>
                    <span class="preco">R$ 99</span>
                </div>
                <p>tecido esportivo.</p>
                <button>Comprar</button>
            </div>

        </main>
    
        <footer>
            <p>© 2026 Loja de Camisetas</p>
        </footer>
